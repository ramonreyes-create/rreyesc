<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Satztrainer B2 PRO</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
}

body{
font-family:Arial, Helvetica, sans-serif;
background:#f5f7fb;
color:#1f2937;
}

header{
background:linear-gradient(135deg,#7c3aed,#1cb0f6);
color:white;
padding:70px 20px;
text-align:center;
}

header h1{
font-size:3rem;
margin-bottom:10px;
}

header p{
font-size:1.15rem;
max-width:850px;
margin:auto;
line-height:1.5;
}

.container{
max-width:1100px;
margin:auto;
padding:40px 20px;
}

.card{
background:white;
border-radius:24px;
padding:30px;
box-shadow:0 10px 25px rgba(0,0,0,.08);
margin-bottom:25px;
}

.lesson-buttons{
display:flex;
flex-wrap:wrap;
gap:12px;
margin-bottom:25px;
}

.lesson-buttons button{
padding:12px 18px;
border:none;
border-radius:14px;
background:#e5e7eb;
font-weight:900;
cursor:pointer;
}

.lesson-buttons button:hover{
background:#c7d2fe;
}

.question{
font-size:2rem;
font-weight:900;
text-align:center;
margin:25px 0;
line-height:1.5;
}

.hint{
background:#eef2ff;
padding:18px;
border-radius:18px;
font-weight:900;
text-align:center;
color:#4338ca;
margin-bottom:25px;
font-size:1.1rem;
}

input{
width:100%;
padding:15px;
border-radius:16px;
border:2px solid #d1d5db;
font-size:1.05rem;
margin-bottom:20px;
}

.btn{
display:inline-block;
background:#7c3aed;
color:white;
padding:14px 22px;
border-radius:16px;
border:none;
font-weight:900;
cursor:pointer;
box-shadow:0 5px 0 #5b21b6;
margin-right:10px;
}

.btn:hover{
background:#6d28d9;
}

.feedback{
margin-top:20px;
padding:16px;
border-radius:16px;
font-weight:900;
display:none;
}

.correct{
background:#dcfce7;
color:#166534;
display:block;
}

.wrong{
background:#fee2e2;
color:#991b1b;
display:block;
}

.progress{
height:18px;
background:#e5e7eb;
border-radius:999px;
overflow:hidden;
margin-top:20px;
}

.progress-bar{
height:100%;
background:#7c3aed;
width:0%;
transition:.3s;
}

.stats{
margin-top:15px;
font-weight:900;
}

.hidden-words{
display:flex;
flex-wrap:wrap;
gap:8px;
margin-top:20px;
}

.hidden-word{
background:#e5e7eb;
padding:8px 12px;
border-radius:999px;
font-weight:900;
color:#6b7280;
}

footer{
text-align:center;
padding:30px;
color:#666;
}

</style>
</head>

<body>

<header>

<h1>🧠 Satztrainer B2 PRO</h1>

<p>
Trainiere komplexe Satzstrukturen mit spanischen pistas und versteckten Lösungen.
</p>

</header>

<main class="container">

<div class="card">

<h2>Themen</h2>

<div class="lesson-buttons">

<button onclick="changeLesson('umwelt')">
🌱 Umwelt
</button>

<button onclick="changeLesson('medien')">
📱 Medien
</button>

<button onclick="changeLesson('schule')">
🏫 Schule
</button>

<button onclick="changeLesson('zukunft')">
🚀 Zukunft
</button>

</div>

<div class="hint" id="hint">
Pista...
</div>

<div class="question" id="question">
Lädt...
</div>

<input type="text" id="answer"
placeholder="Schreibe das deutsche Wort...">

<button class="btn"
onclick="checkAnswer()">
Prüfen
</button>

<button class="btn"
onclick="nextQuestion()">
Nächste Aufgabe
</button>

<div id="feedback"
class="feedback">
</div>

<div class="progress">
<div class="progress-bar"
id="progress-bar">
</div>
</div>

<div class="stats">
<span id="counter"></span>
</div>

<h3 style="margin-top:25px;">
🔒 Noch zu lernen
</h3>

<div class="hidden-words"
id="hidden-words">
</div>

</div>

</main>

<footer>

<p>
© 2026 – Satztrainer B2 PRO
</p>

</footer>

<script>

const lessons = {

umwelt: [

{
sentence:"Viele Jugendliche engagieren sich für den ____.",
answer:"Umweltschutz",
hint:"protección del medioambiente"
},

{
sentence:"Man sollte mehr öffentliche Verkehrsmittel benutzen, ____ die Umwelt zu schützen.",
answer:"um",
hint:"para"
},

{
sentence:"Wenn jeder weniger Plastik benutzen würde, ____ die Umwelt sauberer.",
answer:"wäre",
hint:"sería"
},

{
sentence:"Die Regierung sollte strengere Regeln gegen Umweltverschmutzung ____.",
answer:"einführen",
hint:"introducir"
}

],

medien: [

{
sentence:"Viele Jugendliche verbringen zu viel Zeit ____ sozialen Medien.",
answer:"in",
hint:"en"
},

{
sentence:"Soziale Netzwerke können praktisch sein, ____ sie auch Risiken haben.",
answer:"obwohl",
hint:"aunque"
},

{
sentence:"Man sollte Informationen kritisch ____, bevor man sie glaubt.",
answer:"überprüfen",
hint:"verificar"
},

{
sentence:"Durch das Internet kann man schneller mit anderen Menschen ____.",
answer:"kommunizieren",
hint:"comunicarse"
}

],

schule: [

{
sentence:"Viele Schülerinnen und Schüler stehen unter großem ____.",
answer:"Leistungsdruck",
hint:"presión académica"
},

{
sentence:"Wenn die Schule später beginnen würde, ____ die Jugendlichen weniger müde.",
answer:"wären",
hint:"serían"
},

{
sentence:"Hausaufgaben helfen den Schülern, den Stoff besser zu ____.",
answer:"verstehen",
hint:"entender"
},

{
sentence:"Manche Schülerinnen nehmen Nachhilfe, ____ ihre Noten zu verbessern.",
answer:"um",
hint:"para"
}

],

zukunft: [

{
sentence:"Nach dem Abitur möchte ich an der Universität ____.",
answer:"studieren",
hint:"estudiar"
},

{
sentence:"Viele Jugendliche machen sich Sorgen ____ ihre Zukunft.",
answer:"um",
hint:"por"
},

{
sentence:"Wenn ich mehr Zeit hätte, ____ ich ein Praktikum machen.",
answer:"würde",
hint:"haría"
},

{
sentence:"Es ist wichtig, Fremdsprachen zu lernen, ____ bessere Chancen zu haben.",
answer:"um",
hint:"para"
}

]

};

let currentLesson = "umwelt";
let currentQuestion = 0;
let solved = [];

function loadQuestion(){

let q =
lessons[currentLesson][currentQuestion];

document.getElementById("question")
.innerHTML =
q.sentence;

document.getElementById("hint")
.innerHTML =
"💡 Pista: " + q.hint;

document.getElementById("answer")
.value = "";

updateProgress();
updateHiddenWords();

}

function checkAnswer(){

let userAnswer =
document.getElementById("answer")
.value
.trim()
.toLowerCase();

let correctAnswer =
lessons[currentLesson][currentQuestion]
.answer
.toLowerCase();

let feedback =
document.getElementById("feedback");

if(userAnswer === correctAnswer){

feedback.className =
"feedback correct";

feedback.innerHTML =
"✅ Richtig!";

if(!solved.includes(currentQuestion)){
solved.push(currentQuestion);
}

}else{

feedback.className =
"feedback wrong";

feedback.innerHTML =
"❌ Falsch.";

}

updateProgress();
updateHiddenWords();

}

function nextQuestion(){

currentQuestion++;

if(currentQuestion >=
lessons[currentLesson].length){

currentQuestion = 0;

}

document.getElementById("feedback")
.className = "feedback";

loadQuestion();

}

function changeLesson(lesson){

currentLesson = lesson;
currentQuestion = 0;
solved = [];

document.getElementById("feedback")
.className = "feedback";

loadQuestion();

}

function updateProgress(){

let progress =
(solved.length /
lessons[currentLesson].length)
* 100;

document.getElementById("progress-bar")
.style.width =
progress + "%";

document.getElementById("counter")
.innerHTML =
solved.length +
" / " +
lessons[currentLesson].length +
" gelöst";

}

function updateHiddenWords(){

let container =
document.getElementById("hidden-words");

container.innerHTML = "";

let remaining =
lessons[currentLesson].length -
solved.length;

for(let i=0; i<remaining; i++){

container.innerHTML +=
'<div class="hidden-word">🔒 ?????</div>';

}

}

loadQuestion();

</script>

</body>
</html>
