 "el animal"}, {"de": "die Pflanze", "es": "la planta"}, {"de": "schützen", "es": "proteger"}, {"de": "verschmutzen", "es": "contaminar"}, {"de": "sauber", "es": "limpio"}, {"de": "schmutzig", "es": "sucio"}, {"de": "gefährlich", "es": "peligroso"}, {"de": "das Klima", "es": "el clima"}, {"de": "der Klimawandel", "es": "el cambio climático"}, {"de": "die Lösung", "es": "la solución"}, {"de": "das Problem", "es": "el problema"}, {"de": "die Verantwortung", "es": "la responsabilidad"}, {"de": "umweltfreundlich", "es": "ecológico"}, {"de": "weniger", "es": "menos"}, {"de": "mehr", "es": "más"}]};let lessonNames=Object.keys(LESSONS);let currentLesson=lessonNames[0];let currentIndex=0,direction="de-es",mode="mc";let xp=Number(localStorage.getItem("B1_xp")||0),lives=Number(localStorage.getItem("B1_lives")||5),correct=Number(localStorage.getItem("B1_correct")||0),done=Number(localStorage.getItem("B1_done")||0);document.getElementById("xp").textContent=xp;document.getElementById("lives").textContent=lives;document.getElementById("correct").textContent=correct;document.getElementById("done").textContent=done;function allWords(){return Object.values(LESSONS).flat()}function shuffle(a){return[...a].sort(()=>Math.random()-.5)}function renderLessons(){const box=document.getElementById("lessonList");box.innerHTML="";lessonNames.forEach(n=>{let b=document.createElement("button");b.className="lessonBtn"+(n===currentLesson?" active":"");b.textContent=n+" ("+LESSONS[n].length+")";b.onclick=()=>{currentLesson=n;currentIndex=0;renderLessons();loadTask();renderBank()};box.appendChild(b)})}function renderBank(){const bank=document.getElementById("bank");bank.innerHTML="";LESSONS[currentLesson].forEach(w=>{let c=document.createElement("span");c.className="chip";c.textContent=w.de+" = "+w.es;bank.appendChild(c)})}function loadTask(){const words=LESSONS[currentLesson],item=words[currentIndex],f=document.getElementById("feedback");f.className="feedback";f.textContent="";direction=Math.random()>.5?"de-es":"es-de";mode=Math.random()>.35?"mc":"write";const q=direction==="de-es"?item.de:item.es,ans=direction==="de-es"?item.es:item.de;document.getElementById("question").textContent=q;document.getElementById("lessonTitle").textContent=currentLesson;document.getElementById("instruction").textContent=direction==="de-es"?"Wähle oder schreibe die spanische Übersetzung.":"Wähle oder schreibe die deutsche Übersetzung.";if(mode==="mc"){document.getElementById("options").style.display="grid";document.getElementById("answer").style.display="none";document.getElementById("check").style.display="none";let pool=allWords().map(w=>direction==="de-es"?w.es:w.de).filter(x=>x!==ans);let opts=shuffle(pool).slice(0,3);opts.push(ans);opts=shuffle(opts);const ob=document.getElementById("options");ob.innerHTML="";opts.forEach(o=>{let b=document.createElement("button");b.className="option";b.textContent=o;b.onclick=()=>checkMC(o,ans);ob.appendChild(b)})}else{document.getElementById("options").style.display="none";document.getElementById("answer").style.display="block";document.getElementById("answer").value="";document.getElementById("check").style.display="inline-block";window.currentAnswer=ans}updateBar()}function norm(t){return t.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}function success(){xp+=10;correct++;done++;save();let f=document.getElementById("feedback");f.textContent="Richtig! +10 XP";f.className="feedback ok"}function fail(ans){lives=Math.max(0,lives-1);done++;save();let f=document.getElementById("feedback");f.textContent="Noch nicht. Richtige Antwort: "+ans;f.className="feedback bad"}function checkMC(sel,ans){sel===ans?success():fail(ans)}function checkWritten(){norm(document.getElementById("answer").value)===norm(window.currentAnswer)?success():fail(window.currentAnswer)}function save(){localStorage.setItem("B1_xp",xp);localStorage.setItem("B1_lives",lives);localStorage.setItem("B1_correct",correct);localStorage.setItem("B1_done",done);docu
